<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <title>A-Frame 3D Circle Example</title>
    <script src="https://aframe.io"></script>
  </head>
  <body>
    <a-scene>
      <a-circle 
        position="-1.5 1.5 -3" 
        rotation="-45 0 0" 
        radius="1" 
        color="#FF5733" 
        side="double">
      </a-circle>

      <a-ring 
        position="1.5 1.5 -3" 
        rotation="-45 0 0" 
        radius-inner="0.6" 
        radius-outer="1" 
        color="#33C1FF" 
        side="double">
      </a-ring>

      <a-sky color="#ECECEC"></a-sky>
      <a-plane position="0 0 0" rotation="-90 0 0" width="10" height="10" color="#7BC8A4"></a-plane>
    </a-scene>
  </body>
</html>
